[project]
name = "flypoker"
version = "0.1.0"
description = "A frozen MaleCNS fly connectome learns heads-up no-limit hold'em through a trained readout."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pokerkit",
    "requests",
    "aiohttp>=3.14.3",
    "torch>=2.14.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flypoker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
