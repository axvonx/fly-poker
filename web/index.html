<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly at the Table</title>
  </head>
  <body>
    <main class="stage">
      <section class="game" aria-label="The hand being played">
        <h1 class="title">A fruit fly's nervous system, playing poker</h1>
        <button class="lens-toggle" id="lens" type="button" aria-pressed="false">Fly's-eye view <kbd>F</kbd></button>
        <canvas id="table"></canvas>
        <div class="tags" id="tags" aria-live="polite"></div>
      </section>

      <section class="hud" aria-label="The fly's hand and choices">
        <div class="hud__hand">
          <p class="hud__label">The fly's cards</p>
          <div class="cards" id="fly-cards"></div>
        </div>
        <ol class="readout" id="readout" aria-label="How strongly each choice is firing"></ol>
        <div class="hud__training">
          <p class="hud__label">Hands played since 1 Oct</p>
          <p class="counter" id="hands">—</p>
          <p class="hud__note" id="pace"></p>
          <svg id="training-graph" viewBox="0 0 360 110" role="img" aria-label="Winnings against each bot during training"></svg>
          <ul class="legend" id="legend"></ul>
        </div>
      </section>

      <aside class="specimen" aria-label="The fly's nervous system">
        <canvas id="brain"></canvas>
        <div class="specimen__overlay" aria-hidden="true">
          <p class="specimen__meta" id="specimen-meta">MaleCNS v1.0 · 166,700 neurons</p>
          <div class="scalebar" id="scalebar"><span class="scalebar__bar"></span><span class="scalebar__text">100 µm</span></div>
          <div class="lut"><span class="lut__ramp"></span><span class="lut__text">resting</span><span class="lut__text">firing</span></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
